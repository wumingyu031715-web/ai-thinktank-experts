function renderLibrary(){const list=filtered();document.title='专家库 · AI 智库';document.getElementById('app').innerHTML=`<div class="workspace"><nav class="side-rail"><button class="rail-btn" title="首页">⌂</button><button class="rail-btn" title="推荐">♙</button><button class="rail-btn active" title="专家库">▣</button></nav><main><div class="controls"><div class="segmented"><button class="active" data-page="expert">全部专家</button><button data-page="department">院系</button></div><div class="summary"><span>专家总数 <b>4009</b></span><span>院系数 <b>841</b></span></div><div class="searchbox"><label>搜索</label><input id="search" value="${escapeHtml(state.search)}" placeholder="请输入专家姓名或所在单位"><span class="search-icon">⌕</span></div></div><div class="rank-row"><button class="rank-btn ${state.rank==='院士'?'active':''}" data-rank="院士">院士</button><button class="rank-btn ${state.rank==='文科资深教授'?'active':''}" data-rank="文科资深教授">文科资深教授</button><button class="rank-btn ${state.rank==='正高级'?'active':''}" data-rank="正高级">正高级</button><button class="rank-btn ${state.rank==='副高级'?'active':''}" data-rank="副高级">副高级</button><button class="rank-btn ${state.rank==='中级'?'active':''}" data-rank="中级">中级</button><div class="sort">排序<select id="sort"><option value="default" ${state.sort==='default'?'selected':''}>默认</option><option value="pubs" ${state.sort==='pubs'?'selected':''}>成果数量</option><option value="cites" ${state.sort==='cites'?'selected':''}>引用数量</option></select>⌄</div></div><div class="grid">${list.length?list.map(cardHtml).join(''):'<div class="empty">没有找到匹配的专家</div>'}</div></main></div>`;bindLibrary();}
function cardHtml(e){const tags=e.id==='3'?defaultTags:e.tags;return `<article class="expert-card ${e.id===state.selected?'selected':''}" data-id="${e.id}">${avatar(e.name,parseInt(e.id)-1)}<div class="card-main"><div class="name-line"><span class="name">${e.name}</span><span class="rank-tag">${e.rank}</span></div><div class="affil">${e.affiliation}</div><div class="tags-line"><span class="tag-label">研究标签：</span>${tags.length?tags.slice(0,5).map(t=>`<span class="chip">${t}</span>`).join(''):'<span class="empty-tag">—</span>'}</div><div class="metrics"><span>发表论文 <strong>${e.pubs}</strong></span><span class="divider"></span><span>被引用 <strong>${e.cites}</strong></span></div></div></article>`}
function bindLibrary(){document.querySelectorAll('.expert-card').forEach(x=>x.onclick=()=>openDetail(x.dataset.id));document.getElementById('search').oninput=e=>{state.search=e.target.value;renderLibrary();const el=document.getElementById('search');el.focus();el.setSelectionRange(el.value.length,el.value.length)};document.getElementById('sort').onchange=e=>{state.sort=e.target.value;renderLibrary()};document.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>{state.rank=b.dataset.rank;renderLibrary()});document.querySelector('[data-page="department"]').onclick=()=>{state.search='';state.rank='';document.querySelector('.grid').innerHTML='<div class="empty">院系目录正在整理中，敬请期待</div>'}}
function openDetail(id){state.view='detail';state.selected=id;state.expanded={};state.resultTab='论文著作';state.moreResults=false;history.pushState({id},'',pathBase()+'?id='+id);render()}
function detailExpert(){return experts.find(e=>e.id===state.selected)||experts[2]}
function renderDetail(){const e=detailExpert();document.title=`${e.name} · AI 智库`;const expanded=!!state.expanded.profile;document.getElementById('app').innerHTML=`<div class="workspace"><nav class="side-rail"><button class="rail-btn" title="首页">⌂</button><button class="rail-btn" title="推荐">♙</button><button class="rail-btn active" title="专家库">▣</button></nav><main><div class="detail-shell"><section class="detail-left"><button class="back" id="back">‹ 返回专家库</button><div class="profile-card">${avatar(e.name,parseInt(e.id)-1,'profile-avatar')}<div class="profile-id"><h1>${e.name}</h1><span class="white-tag">${e.rank}</span><p>${e.affiliation}</p><p>清华大学专家库</p></div></div>${sectionHtml('个人简介',` ${e.name}，材料科学家，中国科学院院士、发展中国家科学院院士，长期从事功能复合材料和陶瓷材料的研究，侧重材料物理与基础方面。\n\n主要研究方向包括固态电解质、介电陶瓷、储能材料与界面工程。`,expanded,'profile')}${sectionHtml('教育背景','1978—1982年，华东理工大学，学士；1982—1985年，华东理工大学，硕士学位；1988—1992年，武汉理工大学，博士学位。',!!state.expanded.edu,'edu')}${sectionHtml('工作经历','1999年至今，清华大学教授、博士生导师；曾任材料科学与工程研究院院长。',!!state.expanded.work,'work')}<div class="info-section"><div class="section-title">社会兼职</div><div class="section-text">暂无内容</div></div><div class="info-section"><div class="section-title">所获荣誉</div><div class="section-text">暂无内容</div></div></section><section class="detail-right"><div class="stats-card"><h2>作者统计</h2><div class="stats-grid"><div class="stat"><b>${e.pubs}</b><span>发表论文</span></div><div class="stat"><b>${e.cites}</b><span>被引用</span></div><div class="stat"><b>109</b><span>论文著作</span></div><div class="stat"><b>12</b><span>合作人员</span></div></div></div><div class="detail-panel" style="margin-top:18px"><div style="display:flex;justify-content:space-between;align-items:center"><h2>研究标签</h2><span class="muted">${e.tags.length||5} 个标签</span></div><div class="tags-line" style="height:auto;white-space:normal;overflow:visible;gap:8px">${(e.id==='3'?defaultTags:e.tags.length?e.tags:['材料科学','人工智能','交叉研究']).map(t=>`<span class="chip">${t}</span>`).join('')}</div></div><div class="detail-panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>智库研究合作人员</h2><button class="link-btn" id="morePeople">查看更多 →</button></div><div class="cooperators">${cooperators.slice(0,4).map((c,i)=>cooperatorHtml(c,i)).join('')}</div></div><div class="detail-panel"><h2>研究成果</h2><div class="detail-tabs">${['政策报告','参与项目','论文著作'].map(t=>`<button class="detail-tab ${state.resultTab===t?'active':''}" data-result="${t}">${t}<small style="margin-left:5px;color:#999">${t==='论文著作'?'109':t==='参与项目'?'1':'2'}</small></button>`).join('')}</div><div>${research.slice(0,state.moreResults?research.length:5).map(r=>`<div class="result-item"><div class="result-title">${r[0]}</div><div class="result-meta">${r[1]}</div></div>`).join('')}</div>${!state.moreResults?'<button class="link-btn" id="moreResults">加载更多</button>':'<button class="link-btn" id="collapseResults">收起</button>'}</div></section></div></main></div>`;bindDetail();}
function sectionHtml(title,text,open,key){return `<div class="info-section"><div class="section-title">${title}</div><div class="section-text ${open?'':'clamp'}">${text}</div><button class="more-btn" data-section="${key}">${open?'收起':'展开全部'}</button></div>`}
function cooperatorHtml(c,i){return `<div class="cooperator">${avatar(c[0],i)}<div class="cooperator-info"><b>${c[0]}</b><span>${c[1]} · ${c[2]}</span></div></div>`}
function bindDetail(){document.getElementById('back').onclick=()=>{history.pushState({},'',pathBase());state.view='library';render()};document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{const k=b.dataset.section;state.expanded[k]=!state.expanded[k];renderDetail()});document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{state.resultTab=b.dataset.result;state.moreResults=false;renderDetail()});document.getElementById('morePeople').onclick=()=>{state.cooperatorOpen=true;showCooperators()};const mr=document.getElementById('moreResults');if(mr)mr.onclick=()=>{state.moreResults=true;renderDetail()};const cr=document.getElementById('collapseResults');if(cr)cr.onclick=()=>{state.moreResults=false;renderDetail()}}
function showCooperators(){if(document.getElementById('coopModal'))document.getElementById('coopModal').remove();const d=document.createElement('dialog');d.id='coopModal';d.className='modal';d.innerHTML=`<div class="modal-head"><h3>智库研究合作人员</h3><button class="modal-close">×</button></div><div class="modal-body"><input class="modal-search" placeholder="搜索合作人员姓名" value="${escapeHtml(state.cooperatorSearch)}"><div class="modal-count">共 ${cooperators.length} 位合作人员</div><div class="modal-list" id="modalList"></div><div class="pagination"><button class="page active">1</button><button class="page">2</button><button class="page">3</button></div></div>`;document.body.appendChild(d);const renderPeople=()=>{const q=d.querySelector('.modal-search').value.trim();const arr=cooperators.filter(x=>!q||x[0].includes(q));d.querySelector('#modalList').innerHTML=arr.slice((state.cooperatorPage-1)*5,state.cooperatorPage*5).map((c,i)=>`<div class="modal-person">${avatar(c[0],i,'portrait')}<div class="grow"><b>${c[0]}</b><span>${c[1]} · ${c[2]}</span></div></div>`).join('')||'<div class="empty">没有找到合作人员</div>'};d.querySelector('.modal-close').onclick=()=>d.close();d.querySelector('.modal-search').oninput=renderPeople;d.querySelectorAll('.page').forEach((p,i)=>p.onclick=()=>{state.cooperatorPage=i+1;d.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));p.classList.add('active');renderPeople()});d.addEventListener('close',()=>d.remove());d.showModal();renderPeople()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.onpopstate=()=>{const id=new URLSearchParams(location.search).get('id');state.view=id?'detail':'library';state.selected=id||'3';render()};
const initialId=new URLSearchParams(location.search).get('id');if(initialId){state.view='detail';state.selected=initialId}render();
</script>
</body></html>
